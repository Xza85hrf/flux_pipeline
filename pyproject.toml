[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flux-pipeline"
version = "0.1.0"
description = "FluxPipeline - AI Image Generation Framework using FLUX.1-schnell"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "CC BY-NC 4.0"}
authors = [
    {name = "Xza85hrf", email = ""}
]
keywords = [
    "ai",
    "image-generation",
    "flux",
    "diffusion",
    "pytorch",
    "machine-learning",
    "deep-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Graphics",
]

dependencies = [
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "torchaudio>=0.5.1",
    "diffusers>=0.34.0",
    "transformers>=4.57.1",
    "accelerate>=1.2.1",
    "safetensors>=0.4.5",
    "huggingface-hub>=0.27.0",
    "sentencepiece>=0.1.99",
    "protobuf",
    "grpcio",
    "grpcio-tools",
    "numpy>=2.1.2",
    "Pillow>=11.0.0",
    "psutil>=6.1.0",
    "tqdm>=4.66.6",
    "pynvml>=11.5.3",
    "fsspec>=2024.10.0",
    "PyYAML>=6.0.2",
    "networkx>=3.4.2",
    "sympy>=1.13.1",
    "filelock>=3.16.1",
    "typing_extensions>=4.12.2",
    "regex>=2024.9.11",
    "nltk>=3.9.1",
    "jinja2>=3.1.4",
    "gradio>=5.9.1",
    "fastapi>=0.115.6",
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.12",
    "aiofiles>=23.2.1",
    "orjson>=3.10.10",
    "websockets>=12.0",
    "opencv-python>=4.10.0.84",
    "scikit-image>=0.24.0",
    "cachetools>=5.3.1",
    "rich>=13.9.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.1",
    "black>=24.10.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "mypy>=1.14.0",
]

cuda = [
    "xformers>=0.0.28.post2",
    "cuda-python>=12.6.0",
]

[project.urls]
Homepage = "https://github.com/Xza85hrf/flux_pipeline"
Repository = "https://github.com/Xza85hrf/flux_pipeline"
Issues = "https://github.com/Xza85hrf/flux_pipeline/issues"
Documentation = "https://github.com/Xza85hrf/flux_pipeline#readme"

[project.scripts]
flux-pipeline = "main:main"
flux-gui = "gui:main"

[tool.setuptools]
packages = ["config", "core", "pipeline", "utils"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.yaml", "*.yml"]

# Black configuration
[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312", "py313"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
  | __pycache__
)/
'''

# Ruff configuration
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "B905",  # zip strict argument
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports
"tests/**/*.py" = ["B011"]  # assert False

# MyPy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torchvision.*",
    "transformers.*",
    "diffusers.*",
    "gradio.*",
    "PIL.*",
    "cv2.*",
    "skimage.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--import-mode=importlib",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "performance: Performance tests",
    "benchmark: Benchmark tests",
    "gpu: Tests requiring GPU",
    "async_test: Tests for async operations",
]
filterwarnings = [
    "ignore::FutureWarning:torch.*",
    "ignore::DeprecationWarning:torch.*",
    "ignore::UserWarning:torch.*",
    "ignore::UserWarning:PIL.*",
]

# Coverage configuration
[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
